buildscript {
    repositories {
        // These repositories are only for Gradle plugins, put any other repositories in the repository block further below
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
    }
}
// Only edit below this line, the above code adds and enables the necessary things for Forge to be setup.
plugins {
    id 'eclipse'
    id 'maven-publish'
    id 'java'
}

//This copies each individual template jar into the resources folder so that they can be included and used as expected
task copyTemplates(type: Copy) {
    from '../mc'
    into "src/main/resources/templatejars" 
    include '**/GoAgnosticTemplate-*.jar'
    includeEmptyDirs = false
    duplicatesStrategy = DuplicatesStrategy.FAIL
    eachFile {
        path = name
    }
    doFirst {
        delete "src/main/resources/templatejars"
    }
}

tasks.named('processResources') {
    dependsOn tasks.named('copyTemplates')
}


version = ''
group = 'computer.heather.goagnostic' // http://maven.apache.org/guides/mini/guide-naming-conventions.html
archivesBaseName = "Go!Agnostic"

//We HAVE to target 8 so it can be used by earlier stuff
java.toolchain.languageVersion = JavaLanguageVersion.of(8)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }


repositories {
    // These repositories are only for Gradle plugins, put any other repositories in the repository block further below
    mavenCentral()
}


dependencies {

}

// Example for how to get properties into the manifest for reading at runtime.
jar {
    manifest {
        attributes([
                "Specification-Title"     : "Go!Agnostic",
                "Specification-Vendor"    : "Heather White",
                "Specification-Version"   : "1", // We are version 1 of ourselves
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : "Heather White",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}


tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}