import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar
buildscript {
    repositories {
        // These repositories are only for Gradle plugins, put any other repositories in the repository block further below
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
    }
}
// Only edit below this line, the above code adds and enables the necessary things for Forge to be setup.
plugins {
    id 'eclipse'
    id 'maven-publish'
    id 'java'
    id 'com.gradleup.shadow' version '8.3.0'
    id 'groovy-gradle-plugin'
}

gradlePlugin {
    plugins {
        goAgnostic {
            id = 'computer.heather.goagnostic'
            implementationClass =
                    'computer.heather.goagnostic.gradle.GoAgnosticPlugin'
        }
    }
}

configurations {
    shade
}

tasks.named('shadowJar', ShadowJar) {
    configurations = [project.configurations.shade]
    relocate 'org.objectweb.asm',
            'computer.heather.goagnostic.gradle.internal.asm'
    archiveClassifier.set('')
    mergeServiceFiles()
}

tasks.named('build') {
    dependsOn tasks.named('shadowJar')
}

//This copies each individual template jar into the resources folder so that they can be included and used as expected
//The .bin ending means that shadow doesn't touch them.

def templateJars = fileTree("../mc") {
    include '**/GoAgnosticTemplate-*.jar'
}

processResources {
    templateJars.each { templateJar ->

        from({
            zipTree(templateJar)
        }) {
            //exclude "META-INF/**"
            exclude "computer/**"

            def templateName =
                templateJar.name.substring(
                    0,
                    templateJar.name.length() - ".jar".length()
                )

            into "templates/${templateName}"            
            
            rename { String name ->
                name.endsWith(".class")
                    ? "${name}.bin"
                    : name
            }
        }
    }
}


version = findProperty('publishVersion') ?: '0.1'
group = 'computer.heather.goagnostic' // http://maven.apache.org/guides/mini/guide-naming-conventions.html
archivesBaseName = "Go!Agnostic"

//We HAVE to target 8 so it can be used by earlier stuff
java.toolchain.languageVersion = JavaLanguageVersion.of(8)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }


repositories {
    // These repositories are only for Gradle plugins, put any other repositories in the repository block further below
    mavenCentral()
}


dependencies {
    implementation 'org.ow2.asm:asm-commons:9.10.1'
    shade 'org.ow2.asm:asm-commons:9.10.1'
}

// Example for how to get properties into the manifest for reading at runtime.
jar {
    manifest {
        attributes([
                "Specification-Title"     : "Go!Agnostic",
                "Specification-Vendor"    : "Heather White",
                "Specification-Version"   : "1", // We are version 1 of ourselves
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : "Heather White",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}


tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}




publishing {
    repositories {
        maven {
            name = 'target'

            url = uri(
                findProperty('publishBleedingedge') == 'true'
                    ? 'https://maven.heather.computer/public-snapshot'
                    : 'https://maven.heather.computer/public'
            )
            credentials {
                username = findProperty('heatherMavenUsername')
                password = findProperty('heatherMavenPassword')
            }
        }
    }
}

tasks.register('publishBleedingedge', GradleBuild) {
    group = 'publishing'
    description = 'Publishes the BLEEDINGEDGE version to the snapshot repository'

    tasks = ['publish']

    startParameter.projectProperties.putAll([
        publishVersion: 'BLEEDINGEDGE-SNAPSHOT',
        publishBleedingedge: 'true'
    ])
}