buildscript {
    repositories {
        // These repositories are only for Gradle plugins, put any other repositories in the repository block further below
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath files('../api/build/libs/Go!Agnostic.jar')
    }
}

// Only edit below this line, the above code adds and enables the necessary things for Forge to be setup.
plugins {
    id 'eclipse'
    id 'maven-publish'
    id 'java'
}

apply plugin: 'computer.heather.goagnostic'


version = '1'
group = 'computer.heather.testmod' // http://maven.apache.org/guides/mini/guide-naming-conventions.html
archivesBaseName = "testmod"

//We HAVE to target 8 so it can be used by earlier stuff
java.toolchain.languageVersion = JavaLanguageVersion.of(8)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }


repositories {
    // These repositories are only for Gradle plugins, put any other repositories in the repository block further below
    mavenCentral()
}

dependencies {
    annotationProcessor files('../api/build/libs/Go!Agnostic.jar')
    implementation files('../api/build/libs/Go!Agnostic.jar')
}

// Example for how to get properties into the manifest for reading at runtime.
jar {
    manifest {
        attributes([
                "Specification-Title"     : "Go!Agnostic",
                "Specification-Vendor"    : "Heather White",
                "Specification-Version"   : "1", // We are version 1 of ourselves
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : "Heather White",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}


tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}